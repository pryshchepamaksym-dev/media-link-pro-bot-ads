<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad from Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1c1c1e;
            color: white;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h3 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #f2f2f7;
        }

        button {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #2eaf4f;
        }

        #status {
            margin-top: 20px;
            color: #eaeaea;
            font-size: 14px;
        }
    </style>
    <script>
            // 1. Słownik tłumaczeń (Musi być na samej górze!)
    window.PAGE_LOCALES = {
        "en": {
            "group": "📺 Watch video to boost energy for your group!",
            "private": "📺 Watch video to get Free downloading!",
            "btn_watch": "▶ Watch Video"
        },
        "ru": {
            "group": "📺 Посмотрите видео, чтобы зарядить бота для группы!",
            "private": "📺 Посмотрите видео, чтобы получить бесплатное скачивание!",
            "btn_watch": "▶ Смотреть видео"
        },
        "id": {
            "group": "📺 Tonton video untuk mengisi ulang daya bot grup Anda!",
            "private": "📺 Tonton video untuk mendapatkan unduhan gratis!",
            "btn_watch": "▶ Tonton Video"
        }
    };
    </script>
</head>
<body>

<div class="container">
    <h2 id="textMessage">Loading...</h2>
    <button id="showAdBtn">Loading...</button>
    <div id="status"></div>
</div>

<script>
            function runApp() {
            console.log("=== START APP ===");
            
            const tg = window.Telegram?.WebApp;
            if (!tg) { console.error("Brak Telegram WebAPI"); return; }
            
            tg.ready();
            tg.expand();

            const data = tg.initDataUnsafe || {};
            let lang = 'en';
            let isGroup = false;
            let finalGroupId = null;
            let userName = "User";

            // A. Wykrywanie języka
            if (data.user?.language_code && window.PAGE_LOCALES[data.user.language_code]) {
                lang = data.user.language_code;
            }
            if (data.user?.first_name) userName = data.user.first_name;

            // B. Wykrywanie Grupy
            if (data.chat_type === 'group' || data.chat_type === 'supergroup') {
                if (data.start_param) {
                    isGroup = true;
                    finalGroupId = "-" + data.start_param;
                    console.log("Grupa wykryta (start_param):", finalGroupId);
                }
            } else if (data.chat?.type === 'group' || data.chat?.type === 'supergroup') {
                isGroup = true;
                finalGroupId = data.chat.id;
                console.log("Grupa wykryta (chat object):", finalGroupId);
            }

            // C. Pobranie tekstów
            const texts = window.PAGE_LOCALES[lang] || window.PAGE_LOCALES['en'];
            const msgText = isGroup ? texts.group : texts.private;
            const btnText = texts.btn_watch;

            console.log("Język:", lang);
            console.log("Czy grupa:", isGroup);
            console.log("Tekst do wyświetlenia:", msgText);

            // D. Aktualizacja DOM (Bezpośrednio)
            const txtEl = document.getElementById('textMessage');
            const btnEl = document.getElementById('showAdBtn');

            if (txtEl) {
                txtEl.innerText = msgText;
                console.log("✅ Tekst zaktualizowany!");
            } else {
                console.error("❌ BŁĄD: Element #textMessage nie istnieje w DOM!");
                // Próba ratunkowa: wypisz wszystkie ID ze strony
                const allIds = Array.from(document.querySelectorAll('[id]')).map(e => e.id);
                console.error("Dostępne ID na stronie:", allIds);
            }

            if (btnEl) {
                btnEl.innerText = btnText;
                btnEl.onclick = () => handleAdClick(tg, isGroup, finalGroupId, userName);
                console.log("✅ Przycisk zaktualizowany!");
            } else {
                console.error("❌ BŁĄD: Element #showAdBtn nie istnieje w DOM!");
            }
        }

        function handleAdClick(tg, isGroup, groupId, user) {
            const status = document.getElementById('status');
            if (!window.Adsgram) { status.innerText = "Błąd: Adsgram nie załadowany"; return; }
            
            const controller = window.Adsgram.init({blockId: "3114"});
            status.innerText = "Loading ad...";
            
            controller.show().then(() => {
                status.innerText = "Success!";
                if(isGroup) tg.sendData(`ad_success:group:${groupId}:${user}`);
                else tg.sendData("ad_success");
            }).catch(e => {
                status.innerText = "Error: " + e;
            });
        }

        // Uruchomienie NATYCHMIASTOWE (ponieważ skrypt jest na dole body)
        runApp();
</script>
</body>
</html>
