<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad from Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background-color: #1c1c1e; 
            color: white; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { text-align: center; max-width: 400px; }
        h3 { font-size: 20px; margin-bottom: 25px; color: #f2f2f7; }
        button { 
            padding: 16px 32px; 
            font-size: 16px; 
            font-weight: bold; 
            background-color: #34c759; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:active { background-color: #2eaf4f; }
        #status { margin-top: 20px; color: #eaeaea; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="textMessage">Loading message...</h3>
        <button id="showAdBtn">▶ Watch</button>
        <p id="status"></p>
    </div>

<script>
// 1. Słownik tłumaczeń (Musi być na samej górze!)
const PAGE_LOCALES = {
    "en": {
        "group": "📺 Watch video to boost energy for your group!",
        "private": "📺 Watch video to get Free downloading!",
        "btn_watch": "▶ Watch Video"
    },
    "ru": {
        "group": "📺 Посмотрите видео, чтобы зарядить бота для группы!",
        "private": "📺 Посмотрите видео, чтобы получить бесплатное скачивание!",
        "btn_watch": "▶ Смотреть видео"
    },
    "id": {
        "group": "📺 Tonton video untuk mengisi ulang daya bot grup Anda!",
        "private": "📺 Tonton video untuk mendapatkan unduhan gratis!",
        "btn_watch": "▶ Tonton Video"
    }
};

let tg = null;
let groupId = null;
let userName = "Hero";
let lang = "en";
let AdController = null;

function initializeMiniApp() {
    tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
        tg.ready();
        tg.expand();

        // --- PROFESJONALNE I NIEZAWODNE WYCIĄGANIE STARTAPP ---
        try {
            if (tg.initDataUnsafe && tg.initDataUnsafe.chat) {
                const chat = tg.initDataUnsafe.chat;

                // Sprawdź typ czatu dla pewności
                if (chat.type === 'group' || chat.type === 'supergroup') {
                    groupId = chat.id; // To jest właściwe ID grupy (zazwyczaj ujemne lub duże dodatnie)
                }
            }
            // Scenariusz B: Aplikacja uruchomiona z Private Message przez link startapp
            else if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                // Twój oryginalny fallback dla linków z prywatnych wiadomości
                groupId = "-" + tg.initDataUnsafe.start_param;
            }
        } catch (_) {
        }

        // Bezpieczne pobieranie danych użytkownika
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            if (tg.initDataUnsafe.user.first_name) userName = tg.initDataUnsafe.user.first_name;
            if (tg.initDataUnsafe.user.language_code) {
                const userLang = tg.initDataUnsafe.user.language_code;
                if (PAGE_LOCALES[userLang]) lang = userLang;
            }
        }
    }

    // Inicjalizacja bloku reklamowego Adsgram (ID '3114' to blok testowy)
    if (window.Adsgram) {
        AdController = window.Adsgram.init({blockId: "3114"});
    }

    // AKTUALIZACJA INTERFEJSU NA EKRANIE TELEFONU
    const textMessage = groupId ? PAGE_LOCALES[lang]["group"] : PAGE_LOCALES[lang]["private"];
    const textElement = document.getElementById('textMessage');
    if (textElement) {
        textElement.innerText = textMessage;
    }

    const buttonElement = document.getElementById('showAdBtn');
    if (buttonElement) {
        buttonElement.innerText = PAGE_LOCALES[lang]["btn_watch"];
    }
}

// Odpalamy logikę po pełnym załadowaniu drzewa DOM
document.addEventListener('DOMContentLoaded', initializeMiniApp);

// Obsługa przycisku oglądania reklamy Adsgram
document.getElementById('showAdBtn').addEventListener('click', () => {
    const statusElement = document.getElementById('status');
    if (!AdController) {
        if (statusElement) statusElement.innerText = "Error: Adsgram SDK not loaded.";
        return;
    }

    if (statusElement) statusElement.innerText = "Loading video ad...";

    AdController.show().then((result) => {
        if (statusElement) statusElement.innerText = "Success!";

        if (tg && tg.sendData) {
            if (groupId) {
                tg.sendData("ad_watched_success:group:" + groupId + ":" + userName);
            } else {
                tg.sendData("ad_watched_success");
            }
        }
    }).catch((result) => {
        if (statusElement) statusElement.innerText = "Error. Please try again.";
        console.error("Adsgram error:", result);
    });
});
</script>
</body>
</html>
