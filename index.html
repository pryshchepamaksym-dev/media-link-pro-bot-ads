<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reklama Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background-color: #1c1c1e; 
            color: white; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { text-align: center; max-width: 400px; }
        h3 { font-size: 20px; margin-bottom: 25px; color: #f2f2f7; }
        button { 
            padding: 16px 32px; 
            font-size: 16px; 
            font-weight: bold; 
            background-color: #34c759; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:active { background-color: #2eaf4f; }
        #status { margin-top: 20px; color: #eaeaea; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="textMessage">Obejrzyj krótkie wideo, aby odblokować dodatkowe pobranie</h3>
        <button id="showAdBtn">▶ Watch Ad</button>
        <p id="status"></p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('group_id');

    const textMessage = if(groupId) "Watch video to boost energy for your group!" else "Watch video to get Free downloading!"
    document.getElementById('textMessage').innerText = textMessage;
    
    // Pobieramy imię użytkownika z danych Telegrama (jeśli ukryte, używamy 'Anonymous')
    const userName = tg.initDataUnsafe?.user?.first_name || "Hero";

    const AdController = window.Adsgram.init({ blockId: "3114" }); 

    document.getElementById('showAdBtn').addEventListener('click', () => {
        document.getElementById('status').innerText = "Loading video ad...";
        
        AdController.show().then((result) => {
            document.getElementById('status').innerText = "Success!";
            
            if (groupId) {
                // PRZEKAZUJEMY: status | ID grupy | Imię użytkownika
                tg.sendData("ad_watched_success:group:" + groupId + ":" + userName);
            } else {
                tg.sendData("ad_watched_success");
            }
            
        }).catch((result) => {
            document.getElementById('status').innerText = "Error. Please try again.";
        });
    });
</script>
</body>
</html>
