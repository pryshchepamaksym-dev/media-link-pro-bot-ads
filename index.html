<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Group Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
        }
        h2 { margin-top: 0; font-size: 18px; }
        .status-box {
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            font-size: 14px;
        }
        .result-row:last-child { border-bottom: none; }
        .label { font-weight: bold; color: var(--tg-theme-hint-color, #666); }
        .value {
            text-align: right;
            word-break: break-all;
            margin-left: 10px;
            font-family: monospace;
            font-weight: bold;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        .warning { color: #f39c12; }

        #main-content { display: none; margin-top: 20px; text-align: center; }
        .big-id { font-size: 24px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- SEKCJA DIAGNOSTYCZNA -->
    <div class="status-box">
        <h2>🔍 Dane z Telegram WebApp</h2>
        <div id="debug-output">Ładowanie danych...</div>
    </div>

    <!-- SEKCJA GŁÓWNA (ZMIENIA SIĘ W ZALEŻNOŚCI OD WYNIKU) -->
    <div id="main-content">
        <h1 id="title-text"></h1>
        <div id="id-display" class="big-id"></div>
    </div>

    <script>
        function initializeMiniApp() {
            const tg = window.Telegram ? window.Telegram.WebApp : null;
            const output = document.getElementById('debug-output');
            const mainContent = document.getElementById('main-content');
            const titleText = document.getElementById('title-text');
            const idDisplay = document.getElementById('id-display');

            let html = '';
            let groupId = null;
            let contextType = 'UNKNOWN';

            // Helper do dodawania wierszy
            const addRow = (label, value, className = '') => {
                const valStr = value === undefined || value === null ? 'BRAK' : String(value);
                html += `<div class="result-row"><span class="label">${label}</span><span class="value ${className}">${valStr}</span></div>`;
            };

            if (!tg) {
                html += `<div class="result-row"><span class="label error">BŁĄD</span><span class="value error">Skrypt Telegram nie załadowany!</span></div>`;
                output.innerHTML = html;
                return;
            }

            tg.ready();
            tg.expand();

            // 1. Sprawdzenie podstawowych flag
            addRow('WebApp Inicjalizacja', 'OK', 'success');
            addRow('initDataUnsafe obecne', !!tg.initDataUnsafe);

            if (tg.initDataUnsafe) {
                // 2. Kluczowe dane
                addRow('chat_type (typ czatu)', tg.initDataUnsafe.chat_type || 'UNDEFINED', tg.initDataUnsafe.chat_type ? 'success' : 'error');
                addRow('start_param (parametr start)', tg.initDataUnsafe.start_param || 'UNDEFINED');

                // 3. Szczegóły obiektu Chat (NAJWAŻNIEJSZE)
                if (tg.initDataUnsafe.chat) {
                    const chat = tg.initDataUnsafe.chat;
                    addRow('OBIEKT CHAT', 'ZNaleziony!', 'success');
                    addRow('ID Czat/Grupy', chat.id, 'success');
                    addRow('Typ Czat', chat.type);
                    addRow('Tytuł Czat', chat.title || 'Brak tytułu');

                    groupId = chat.id;
                    contextType = chat.type; // 'group', 'supergroup', 'private'
                } else {
                    addRow('OBIEKT CHAT', 'NIE OBECNY (undefined)', 'error');
                    addRow('Przyczyna', 'Link kliknięty jako wiadomość, nie przez menu @bot', 'warning');
                }

                // 4. Dane użytkownika (dla kontekstu)
                if (tg.initDataUnsafe.user) {
                    addRow('Użytkownik', `${tg.initDataUnsafe.user.first_name} (ID: ${tg.initDataUnsafe.user.id})`);
                }
            } else {
                addRow('initDataUnsafe', 'CAŁKOWICIE BRAK', 'error');
            }

            // Wyświetl debug
            output.innerHTML = html;

            // --- LOGIKA BIZNESOWA ---
            mainContent.style.display = 'block';

            if (groupId && (contextType === 'group' || contextType === 'supergroup' || contextType === 'channel')) {
                // SUKCES: Jesteśmy w grupie
                titleText.innerText = "✅ Wykryto Grupę";
                titleText.style.color = "var(--tg-theme-button-color, #2ecc71)";
                idDisplay.innerText = "ID: " + groupId;
                idDisplay.style.color = "var(--tg-theme-button-color, #2ecc71)";

                // TU WYWOŁAJ SWOJĄ FUNKCJĘ ŁADUJĄCĄ DANE GRUPY
                // loadGroupData(groupId);
            } else if (tg.initDataUnsafe.start_param) {
                // Scenariusz: Start z prywatnej wiadomości z parametrem
                titleText.innerText = "⚠️ Tryb StartApp";
                titleText.style.color = "var(--tg-theme-hint-color, #f39c12)";
                const manualId = "-" + tg.initDataUnsafe.start_param;
                idDisplay.innerText = "ID z parametru: " + manualId;
            } else {
                // BŁĄD / PRYWATNA WIADOMOŚĆ
                titleText.innerText = "❌ Brak kontekstu grupy";
                titleText.style.color = "var(--tg-theme-button-color, #e74c3c)";
                idDisplay.innerText = "Widok prywatny (Private Chat)";
                idDisplay.style.color = "var(--tg-theme-button-color, #e74c3c)";

                // TU LOGIKA DLA WIADOMOŚCI PRYWATNEJ
            }
        }

        // Uruchomienie
        initializeMiniApp();
    </script>
</body>
</html>
