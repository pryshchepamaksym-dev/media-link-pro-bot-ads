<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad from Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background-color: #1c1c1e; 
            color: white; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { text-align: center; max-width: 400px; }
        h3 { font-size: 20px; margin-bottom: 25px; color: #f2f2f7; }
        button { 
            padding: 16px 32px; 
            font-size: 16px; 
            font-weight: bold; 
            background-color: #34c759; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:active { background-color: #2eaf4f; }
        #status { margin-top: 20px; color: #eaeaea; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="textMessage">Loading message...</h3>
        <button id="showAdBtn">▶ Watch Ad</button>
        <p id="status"></p>
    </div>

<script>
    // Słownik tłumaczeń (musi być na samej górze!)
    const PAGE_LOCALES = {
        "en": {
            "group": "📺 Watch video to boost energy for your group!",
            "private": "📺 Watch video to get Free downloading!"
        },
        "ru": {
            "group": "📺 Посмотрите видео, чтобы зарядить бота для группы!",
            "private": "📺 Посмотрите видео, чтобы получить бесплатное скачивание!"
        },
        "id": {
            "group": "📺 Tonton video untuk mengisi ulang daya bot grup Anda!",
            "private": "📺 Tonton video untuk mendapatkan unduhan gratis!"
        }
    };

    // Oficjalne i bezpieczne przypisanie obiektu Telegram Web App
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    // Bezpieczne wyciąganie języka (domyślnie 'en')
    const userLang = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.language_code : "en";
    const lang = PAGE_LOCALES[userLang] ? userLang : "en";

    // Bezpieczne wyciąganie parametru startapp (ID grupy)
    let groupId = null;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        groupId = "-" + tg.initDataUnsafe.start_param;
    }

    // Bezpieczne wyciąganie imienia użytkownika
    const userName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.first_name : "Hero";

    // Inicjalizacja Adsgram (ID '3114' to oficjalny blok testowy)
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "3114" }) : null;

    // --- POPRAWIONA I STABILNA FUNKCJA AKTUALIZACJI TEKSTU ---
    function updateMessage() {
        const textMessage = groupId ? PAGE_LOCALES[lang]["group"] : PAGE_LOCALES[lang]["private"];
        const textElement = document.getElementById('textMessage');
        if (textElement) {
            textElement.innerText = textMessage;
        }
    }

    // Uruchamiamy od razu po załadowaniu drzewa DOM, aby uniknąć błędów kolejności ładowania skryptów
    document.addEventListener('DOMContentLoaded', updateMessage);

    // Obsługa przycisku reklamy Adsgram
    document.getElementById('showAdBtn').addEventListener('click', () => {
        const statusElement = document.getElementById('status');
        if (!AdController) {
            if (statusElement) statusElement.innerText = "Error: Adsgram SDK not loaded.";
            return;
        }

        if (statusElement) statusElement.innerText = "Loading video ad...";
        
        AdController.show().then((result) => {
            if (statusElement) statusElement.innerText = "Success!";
            
            // Wysyłamy dane z powrotem do bota (tylko jeśli działamy wewnątrz Telegrama)
            if (tg && tg.sendData) {
                if (groupId) {
                    tg.sendData("ad_watched_success:group:" + groupId + ":" + userName);
                } else {
                    tg.sendData("ad_watched_success");
                }
            }
        }).catch((result) => {
            if (statusElement) statusElement.innerText = "Error. Please try again.";
            console.error("Adsgram error:", result);
        });
    });
</script>
</body>
</html>
