<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad from Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1c1c1e;
            color: white;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h3 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #f2f2f7;
        }

        button {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #2eaf4f;
        }

        #status {
            margin-top: 20px;
            color: #eaeaea;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 id="textMessage">Loading message...</h3>
    <button id="showAdBtn">▶ Watch</button>
    <p id="status"></p>
</div>

<script>
    // 1. Słownik tłumaczeń (Musi być na samej górze!)
    const PAGE_LOCALES = {
        "en": {
            "group": "📺 Watch video to boost energy for your group!",
            "private": "📺 Watch video to get Free downloading!",
            "btn_watch": "▶ Watch Video"
        },
        "ru": {
            "group": "📺 Посмотрите видео, чтобы зарядить бота для группы!",
            "private": "📺 Посмотрите видео, чтобы получить бесплатное скачивание!",
            "btn_watch": "▶ Смотреть видео"
        },
        "id": {
            "group": "📺 Tonton video untuk mengisi ulang daya bot grup Anda!",
            "private": "📺 Tonton video untuk mendapatkan unduhan gratis!",
            "btn_watch": "▶ Tonton Video"
        }
    };

    function initializeMiniApp() {
    const tg = window.Telegram?.WebApp || null;
    
    // Domyślne wartości
    let userName = "Hero";
    let lang = "en"; // Domyślny język
    let finalGroupId = null;
    let isGroupContext = false;
    let AdController = null;

    // 1. Inicjalizacja Telegram
    if (tg) {
        tg.ready();
        tg.expand();
        const data = tg.initDataUnsafe || {};

        // --- WYKRYWANIE GRUPY ---
        if (data.chat_type && ['group', 'supergroup'].includes(data.chat_type)) {
            if (data.start_param) {
                isGroupContext = true;
                finalGroupId = "-" + String(data.start_param).trim();
            }
        } else if (data.chat && ['group', 'supergroup'].includes(data.chat.type)) {
            isGroupContext = true;
            finalGroupId = data.chat.id;
        }

        // --- DANE UŻYTKOWNIKA ---
        if (data.user) {
            if (data.user.first_name) userName = data.user.first_name;
            
            // Bezpieczna zmiana języka TYLKO jeśli istnieje w słowniku
            if (data.user.language_code) {
                const userLang = data.user.language_code;
                // Sprawdź, czy język ISTNIEJE i ma potrzebne klucze
                if (window.PAGE_LOCALES && PAGE_LOCALES[userLang] && PAGE_LOCALES[userLang].group) {
                    lang = userLang;
                } else {
                    console.log(`Język ${userLang} nieobsługiwany, używam domyślnego: ${lang}`);
                }
            }
        }
    }

    // 2. Inicjalizacja Adsgram
    if (window.Adsgram) {
        AdController = window.Adsgram.init({ blockId: "3114" });
    }

    // 3. Bezpieczna aktualizacja tekstu (z fallbackiem)
    const textElement = document.getElementById('textMessage');
    const buttonElement = document.getElementById('showAdBtn');
    
    // Pobierz tekst z fallbackiem na angielski, jeśli brakuje tłumaczenia
    let textToDisplay = "Loading...";
    let btnToDisplay = "Watch Ad";

    if (window.PAGE_LOCALES && PAGE_LOCALES[lang]) {
        const locale = PAGE_LOCALES[lang];
        const key = isGroupContext ? "group" : "private";
        
        // Jeśli brakuje tekstu dla kontekstu, spróbuj angielskiego
        textToDisplay = locale[key] || (PAGE_LOCALES['en'] ? PAGE_LOCALES['en'][key] : "Welcome");
        btnToDisplay = locale["btn_watch"] || (PAGE_LOCALES['en'] ? PAGE_LOCALES['en']['btn_watch'] : "Watch Ad");
    }

    if (textElement) {
        textElement.innerText = textToDisplay;
        console.log("Tekst zaktualizowany na:", textToDisplay);
    } else {
        console.error("ELEMENT textMessage NIE ZNALEZIONY!");
    }

    if (buttonElement) {
        buttonElement.innerText = btnToDisplay;
        
        buttonElement.addEventListener('click', () => {
            const statusElement = document.getElementById('status');
            if (!AdController) {
                if (statusElement) statusElement.innerText = "Error: Ads not loaded.";
                return;
            }

            if (statusElement) statusElement.innerText = "Loading...";

            AdController.show().then(() => {
                if (statusElement) statusElement.innerText = "Success!";
                if (tg && tg.sendData) {
                    const payload = isGroupContext 
                        ? `ad_watched_success:group:${finalGroupId}:${userName}` 
                        : "ad_watched_success";
                    tg.sendData(payload);
                }
            }).catch((err) => {
                if (statusElement) statusElement.innerText = "Error.";
                console.error(err);
            });
        });
    } else {
        console.error("ELEMENT showAdBtn NIE ZNALEZIONY!");
    }
}

document.addEventListener('DOMContentLoaded', initializeMiniApp);
</script>
</body>
</html>
