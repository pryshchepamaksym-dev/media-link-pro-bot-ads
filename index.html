<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad from Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1c1c1e;
            color: white;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h3 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #f2f2f7;
        }

        button {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #2eaf4f;
        }

        #status {
            margin-top: 20px;
            color: #eaeaea;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 id="textMessage">Loading message...</h3>
    <button id="showAdBtn">▶ Watch</button>
    <p id="status"></p>
</div>

<script>
    // 1. Słownik tłumaczeń (Musi być na samej górze!)
    const PAGE_LOCALES = {
        "en": {
            "group": "📺 Watch video to boost energy for your group!",
            "private": "📺 Watch video to get Free downloading!",
            "btn_watch": "▶ Watch Video"
        },
        "ru": {
            "group": "📺 Посмотрите видео, чтобы зарядить бота для группы!",
            "private": "📺 Посмотрите видео, чтобы получить бесплатное скачивание!",
            "btn_watch": "▶ Смотреть видео"
        },
        "id": {
            "group": "📺 Tonton video untuk mengisi ulang daya bot grup Anda!",
            "private": "📺 Tonton video untuk mendapatkan unduhan gratis!",
            "btn_watch": "▶ Tonton Video"
        }
    };

    function initializeMiniApp() {
        // 1. Inicjalizacja Telegram WebApp
        const tg = window.Telegram?.WebApp || null;

        // Domyślne wartości
        let userName = "Hero";
        let lang = "en";
        let finalGroupId = null;
        let isGroupContext = false;
        let AdController = null;

        // 2. Bezpieczne pobieranie danych z Telegram
        if (tg) {
            tg.ready();
            tg.expand();

            const data = tg.initDataUnsafe || {};

            // --- LOGIKA WYKRYWANIA GRUPY (Ulepszona) ---
            try {
                // Scenariusz A: Grupa wykryta przez chat_type, ale obiekt chat ukryty (Link bezpośredni)
                // To jest Twój główny przypadek użycia
                if (data.chat_type && ['group', 'supergroup'].includes(data.chat_type)) {
                    if (data.start_param) {
                        isGroupContext = true;
                        // Upewnij się, że start_param jest stringiem i dodaj myślnik
                        finalGroupId = "-" + String(data.start_param).trim();
                        console.log("Grupa wykryta (tryb linku):", finalGroupId);
                    } else {
                        console.warn("Wykryto grupę, ale brak start_param. Sprawdź link.");
                    }
                }
                // Scenariusz B: Pełny obiekt chat (Menu Attachments @bot)
                else if (data.chat && ['group', 'supergroup'].includes(data.chat.type)) {
                    isGroupContext = true;
                    finalGroupId = data.chat.id;
                    console.log("Grupa wykryta (tryb menu):", finalGroupId);
                }
            } catch (e) {
                console.error("Błąd podczas parsowania danych grupy:", e);
            }

            // --- DANE UŻYTKOWNIKA (Bezpieczne) ---
            // UWAGA: initDataUnsafe jest niezaufany. W produkcji zweryfikuj tg.initData na backendzie!
            if (data.user) {
                if (data.user.first_name) {
                    userName = data.user.first_name;
                }
                if (data.user.language_code) {
                    const userLang = data.user.language_code;
                    // Sprawdź, czy język istnieje w Twoim słowniku, zanim go ustawisz
                    if (window.PAGE_LOCALES && window.PAGE_LOCALES[userLang]) {
                        lang = userLang;
                    }
                }
            }
        } else {
            console.warn("Telegram WebApp nieznaleziony. Uruchomiono poza Telegramem.");
        }

        // 3. Inicjalizacja Adsgram (z ochroną)
        if (window.Adsgram) {
            try {
                // ID '3114' to blok testowy. Zmień na produkcyjny przed wdrożeniem.
                AdController = window.Adsgram.init({blockId: "3114"});
                console.log("Adsgram zainicjalizowany.");
            } catch (err) {
                console.error("Błąd inicjalizacji Adsgram:", err);
            }
        } else {
            console.warn("SDK Adsgram nie załadowane. Sprawdź tag <script>.");
        }

        // 4. Aktualizacja Interfejsu (z ochroną przed null)
        const textElement = document.getElementById('textMessage');
        if (textElement && window.PAGE_LOCALES && PAGE_LOCALES[lang]) {
            const messageKey = isGroupContext ? "group" : "private";
            textElement.innerText = PAGE_LOCALES[lang][messageKey] || "Welcome";
        }

        const buttonElement = document.getElementById('showAdBtn');
        if (buttonElement && window.PAGE_LOCALES && PAGE_LOCALES[lang]) {
            buttonElement.innerText = PAGE_LOCALES[lang]["btn_watch"] || "Watch Ad";

            // 5. Obsługa kliknięcia reklam
            buttonElement.addEventListener('click', () => {
                const statusElement = document.getElementById('status');

                if (!AdController) {
                    if (statusElement) {
                        statusElement.innerText = "Error: Adsgram not ready.";
                        statusElement.style.color = "red";
                    }
                    console.error("Próba wyświetlenia reklamy bez AdsController.");
                    return;
                }

                if (statusElement) {
                    statusElement.innerText = "Loading video ad...";
                    statusElement.style.color = "orange";
                }

                AdController.show()
                    .then((result) => {
                        if (statusElement) {
                            statusElement.innerText = "Success! Reward granted.";
                            statusElement.style.color = "green";
                        }

                        // Wysyłanie danych do bota
                        if (tg && tg.sendData) {
                            let payload = "ad_watched_success";
                            if (isGroupContext && finalGroupId) {
                                payload += `:group:${finalGroupId}:${userName}`;
                            }

                            tg.sendData(payload);
                            console.log("Dane wysłane do bota:", payload);
                        } else {
                            console.warn("tg.sendData niedostępne (może wymagać custom keyboard).");
                        }
                    })
                    .catch((err) => {
                        if (statusElement) {
                            statusElement.innerText = "Error. Please try again.";
                            statusElement.style.color = "red";
                        }
                        console.error("Adsgram error:", err);
                    });
            });
        } else {
            console.warn("Elementy DOM ('textMessage' lub 'showAdBtn') nie znalezione.");
        }
    }

    // Uruchomienie po załadowaniu DOM
    document.addEventListener('DOMContentLoaded', initializeMiniApp);
</script>
</body>
</html>
