<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reklama Adsgram</title>
    <!-- Oficjalne skrypty Telegrama oraz Adsgram -->
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background-color: #1c1c1e; 
            color: white; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { text-align: center; max-width: 400px; }
        h3 { font-size: 20px; margin-bottom: 25px; color: #f2f2f7; }
        button { 
            padding: 16px 32px; 
            font-size: 16px; 
            font-weight: bold; 
            background-color: #34c759; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:active { background-color: #2eaf4f; }
        #status { margin-top: 20px; color: #eaeaea; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="textMessage">Loading message...</h3>
        <button id="showAdBtn">▶ Watch Ad</button>
        <p id="status"></p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Pobieramy język użytkownika z Telegrama (domyślnie angielski 'en')
    const userLang = tg.initDataUnsafe?.user?.language_code || "en";
    const lang = PAGE_LOCALES[userLang] ? userLang : "en";

    // Wyciągamy parametr startapp
    let groupId = null;
    if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        groupId = "-" + tg.initDataUnsafe.start_param;
    }

    const userName = tg.initDataUnsafe?.user?.first_name || "Hero";
    const AdController = window.Adsgram.init({ blockId: "3114" }); 

    // --- KLUCZOWY ELEMENT: USTAWIENIE TEKSTU PRZY ŁADOWANIU STRONY ---
    document.addEventListener('DOMContentLoaded', () => {
        // Poprawny zapis warunku za pomocą operatora trójargumentowego (?) w JS
        const textMessage = groupId 
            ? PAGE_LOCALES[lang]["group"] 
            : PAGE_LOCALES[lang]["private"];
            
        // Wstrzykujemy dynamiczny tekst do Twojego elementu HTML o id='textMessage'
        const textElement = document.getElementById('textMessage');
        if (textElement) {
            textElement.innerText = textMessage;
        }
    });

    // Obsługa przycisku odpalania reklamy Adsgram (bez zmian)
    document.getElementById('showAdBtn').addEventListener('click', () => {
        document.getElementById('status').innerText = "Loading video ad...";
        
        AdController.show().then((result) => {
            document.getElementById('status').innerText = "Success!";
            
            if (groupId) {
                tg.sendData("ad_watched_success:group:" + groupId + ":" + userName);
            } else {
                tg.sendData("ad_watched_success");
            }
            
        }).catch((result) => {
            document.getElementById('status').innerText = "Error. Please try again.";
        });
    });
</script>
</body>
</html>
