<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Link Pro Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1c1c1e;
            color: white;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container { text-align: center; max-width: 400px; }
        h3 { font-size: 20px; margin-bottom: 25px; color: #f2f2f7; }
        button {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:active { background-color: #2eaf4f; }
        #status { margin-top: 20px; color: #eaeaea; font-size: 14px; }
    </style>

    <!-- SŁOWNIK -->
    <script>
        window.PAGE_LOCALES = {
        "en": {
            "group": "📺 Watch video to boost energy for your group!",
            "private": "📺 Watch video to get Free downloading!",
            "btn_watch": "▶ Watch Video"
        },
        "ru": {
            "group": "📺 Посмотрите видео, чтобы зарядить бота для группы!",
            "private": "📺 Посмотрите видео, чтобы получить бесплатное скачивание!",
            "btn_watch": "▶ Смотреть видео"
        },
        "id": {
            "group": "📺 Tonton video untuk mengisi ulang daya bot grup Anda!",
            "private": "📺 Tonton video untuk mendapatkan unduhan gratis!",
            "btn_watch": "▶ Tonton Video"
        }
    };
    </script>
</head>
<body>

    <!-- 2. GŁÓWNA APLIKACJA (Przesunięta w dół) -->
    <div class="container">
        <h2 id="textMessage">Loading...</h2>
        <button id="showAdBtn">Loading...</button>
        <div id="status"></div>
    </div>

    <!-- 3. SKRYPT -->
    <script>
        function runApp() {
            const tg = window.Telegram?.WebApp;
            if (!tg) {
                return;
            }

            tg.ready();
            tg.expand();

            const data = tg.initDataUnsafe || {};
            let lang = 'en';
            let isGroup = false;
            let finalGroupId = null;
            let userName = "User";

            // A. Wykrywanie języka
            if (data.user?.language_code) {
                const userLang = data.user.language_code;
                if (window.PAGE_LOCALES[userLang]) {
                    lang = userLang;
                }
            }
            if (data.user?.first_name) userName = data.user.first_name;

            if (data.chat_type === 'group' || data.chat_type === 'supergroup') {
                if (data.start_param) {
                    isGroup = true;
                    finalGroupId = "-" + data.start_param;
                }
            } else if (data.chat?.type === 'group' || data.chat?.type === 'supergroup') {
                isGroup = true;
                finalGroupId = data.chat.id;
            }

            // C. Pobranie tekstów
            const texts = window.PAGE_LOCALES[lang] || window.PAGE_LOCALES['en'];
            const msgText = isGroup ? texts.group : texts.private;
            const btnText = texts.btn_watch;

            // D. Aktualizacja DOM
            const txtEl = document.getElementById('textMessage');
            const btnEl = document.getElementById('showAdBtn');

            if (txtEl) {
                txtEl.innerText = msgText;
            }

            if (btnEl) {
                btnEl.innerText = btnText;
                btnEl.onclick = () => handleAdClick(tg, isGroup, finalGroupId, userName);
            }
        }

        function handleAdClick(tg, isGroup, groupId, user) {
            const status = document.getElementById('status');

            if (!window.Adsgram) {
                status.innerText = "Błąd: Adsgram nie działa";
                return;
            }

            const controller = window.Adsgram.init({blockId: "3114"});
            status.innerText = "Loading ad...";

            controller.show().then(() => {
                status.innerText = "Success!";

                const payload = isGroup
                    ? `ad_success:group:${groupId}:${user}`
                    : "ad_success";

                tg.sendData(payload);
            }).catch(e => {
                status.innerText = "Error: " + e;
            });
        }

        // Uruchomienie
        runApp();
    </script>
</body>
</html>
